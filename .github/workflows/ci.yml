name: Verify analyzer
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Numerical regression and coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser at actual Pages subpath
        run: npm run test:browser
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
