name: Development bootstrap
on:
  push:
    branches: [dev]
    paths: [.github/workflows/bootstrap-dev.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Prepare local verification bundle
        run: tar -czf development-dependencies.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: development-baseline
          path: |
            development-dependencies.tgz
            package-lock.json
            dist/
          retention-days: 3
