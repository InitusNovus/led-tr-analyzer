name: Development bootstrap
on:
  push:
    branches: [dev]
    paths: [.github/workflows/bootstrap-dev.yml]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --package-lock-only
      - name: Commit lockfile to development branch only
        run: |
          test "${GITHUB_REF}" = refs/heads/dev
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock existing dependencies for reproducible installation (#4)'
            git push origin HEAD:dev
          fi
